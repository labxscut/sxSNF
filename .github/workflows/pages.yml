name: Deploy Docs to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package and doc tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Generate documentation
        run: python scripts/generate_pydoc.py

      - name: Redirect legacy Pages URL
        run: |
          cat > docs/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <link rel="canonical" href="https://labxscut.github.io/tools/sxSNF/">
            <meta http-equiv="refresh" content="0; url=https://labxscut.github.io/tools/sxSNF/">
            <title>sxSNF documentation moved</title>
          </head>
          <body>
            <p>sxSNF documentation has moved to <a href="https://labxscut.github.io/tools/sxSNF/">LabX Tools</a>.</p>
            <script>location.replace("https://labxscut.github.io/tools/sxSNF/");</script>
          </body>
          </html>
          HTML

      - name: Disable Jekyll processing
        run: touch docs/.nojekyll

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
